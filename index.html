<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahalle Emlakçısı</title>
<meta name="description" content="Mahalle Emlakçısı: Kadıköy'de geçen Türkçe emlak ve ev sahibi oyunu.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#f6f1e8; --fg:#2b2420; --muted:#6d625a; --card:#fffaf2; --line:#e3d8c8; --accent:#b4532a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a17; --fg:#f1ebe3; --muted:#b3a89c; --card:#27231f; --line:#3a332d; --accent:#e08a5c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 20px; text-align:center; }
  img { width:120px; height:120px; border-radius:27px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  h1 { font-size:28px; margin:24px 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  p { margin:0 0 16px; }
  nav { display:flex; flex-direction:column; gap:10px; margin-top:32px; }
  nav a { display:block; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--fg); text-decoration:none; font-weight:600; }
  nav a:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:40px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Mahalle Emlakçısı simgesi">
  <h1>Mahalle Emlakçısı</h1>
  <p class="sub">Ev Sahibi &amp; Kiracı Simülasyonu</p>
  <p>Babaannenden Moda'da bir daire kaldı. Gerisi sana bağlı.</p>
  <p>Kadıköy'de geçen Türkçe bir emlak oyunu: kiracını seç, yalanı yakala, pazarlık et, tadilat yaptır ve portföyünü büyüt.</p>

    <a href="https://docs.google.com/document/d/e/2PACX-1vRL4Wha3cFFxv9FV9U6bu_zmFiW51tNuwPgTrFErF0VMouK_JOQwyIw1eBL3NwV6LvvW7PWjRYzxPwD/pub">Destek</a>
    <a href="https://docs.google.com/document/d/e/2PACX-1vQQ5P4PlR2AfhKqZ23WLDcGDGB_Zo9mss9YcR9ut1aDLZNxI6Iyb6b49sD6xht3fRwUnFdLfsBdJPGL/pub">Gizlilik Politikası</a>
  </nav>
  <footer>© 2026 Emre Kesimal</footer>
</main>
</body>
</html>
